stages:
  - deploy

pages:
  stage: deploy
  image: alpine:3.22
  tags:
    - docker
    - linux
    - x86
  before_script:
    - apk add --no-cache nodejs npm
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build:standalone
    - mkdir -p public
    - cp -R outputs/optical-calculator/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
