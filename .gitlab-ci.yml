stages:
  - deploy

pages:
  stage: deploy
  image: alpine:3.22
  tags:
    - gpu
  before_script:
    - apk add --no-cache nodejs npm
  script:
    - npm ci
    - npm run build:standalone
    - mkdir -p public
    - cp -R outputs/optical-calculator/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
